# Builds and publishes a release when a version tag is pushed.
#
# The tag is the version: push 0.2.0 (or v0.2.0) and that is what the installer
# is stamped with and what the release is called. Nothing in the repository
# records a version, so there is no second place to forget to update.

name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'

# gh release create writes to the repository.
permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # build.ps1 looks for ISCC in the places it normally lands, including
      # this one, so nothing needs to be told where it is.
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Derive the version from the tag
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}' -replace '^v', ''
          Write-Host "Building $version from tag ${{ github.ref_name }}"
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Runs the tests, builds windock.exe and compiles the installer.
      - name: Build
        shell: pwsh
        run: .\build.ps1 -Version $env:VERSION

      # The bare executable is worth publishing beside the installer, for
      # anyone who would rather unpack it themselves. Versioning its name keeps
      # downloads distinguishable once there is more than one release.
      - name: Stage the loose executable
        shell: pwsh
        run: Copy-Item windock.exe "dist\windock-$env:VERSION.exe"

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' `
            "dist\windock-setup-$env:VERSION.exe" `
            "dist\windock-$env:VERSION.exe" `
            --title "windock-go $env:VERSION" `
            --generate-notes
